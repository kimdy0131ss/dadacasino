<!DOCTYPE html>
<html lang="ko">
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <ul>
                <li><img id="change" src="logo_1.png"></li>
                <li><a href="index.html">홈</a></li>
                <li><a href="cash.html">충전</a></li>
                <li><a href="#">게임하기</a></li>
                <li><a href="#">문의하기</a></li>
            </ul>
        </nav>
        
        <div class="container">
            <h1 style="font-size: 40px; color: white; margin-left: -60px; margin-top: 70px; margin-bottom: 0px; grid-column: 1/-1; grid-row: 1; text-align: center; align-self: start;">충전하기</h1>

            <button class="card">1</button>
            <button class="card">2</button>
            <button class="card">3</button>
            <button class="card">4</button>
            <button class="card">5</button>
            <button class="card">6</button>

            <button id="confirm" style="font-size: 30px; background-color: black; border: 2px solid white; color: white; margin-top: 0px; margin-bottom: -30px; grid-column: 3/2; grid-row: 4; text-align: center; margin-left: -40px;">선택완료</button>
        </div>

        <script>
            const images = ["logo_1.png", "logo_2.png"];
            let index = 0;

            setInterval(() => {
            index = (index + 1) % images.length;
            document.getElementById("change").src = images[index];
            }, 500);

            const buttons = document.querySelectorAll(".card");

            buttons.forEach(button => {
              button.addEventListener("click", () => {
                buttons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");
              });
            });

        </script>
    </body>
</html>
